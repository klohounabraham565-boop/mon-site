<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon site web</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1>Bienvenue sur mon site</h1>
        <p>Mon premier vrai site web.</p>
    </header>


    <nav>
        <a href="#accueil">Accueil</a>
        <a href="#apropos">À propos</a>
        <a href="#competences">Compétences</a>
        <a href="#contact">Contact</a>
    </nav>


    <main>

        <section id="accueil">
            <h2>Bienvenue</h2>

            <p id="description">
                Découvrez mon premier site web.
            </p>

            <img src="photo.png"
                 alt="Photo de présentation">

            <button class="btn">En savoir plus</button>
        </section>


        <section id="apropos">
            <h2>À propos</h2>

            <p>
                Je suis en train d'apprendre à créer des sites web
                avec HTML, CSS et JavaScript.
            </p>
        </section>


        <section id="competences">
            <h2>Mes compétences</h2>

            <div class="competences">

                <div class="competence">
                    HTML
                </div>

                <div class="competence">
                    CSS
                </div>

                <div class="competence">
                    JavaScript
                </div>

            </div>
        </section>

       <h2>CONTACTEZ MOI</h2>

        <form id="contact">

            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
            </div>
        
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" required>
            </div>
        
            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" placeholder="+229 XX XX XX XX XX">
            </div>
        
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"
                          placeholder="Écrivez votre message..." required></textarea>
            </div>
        
            <button type="submit">Envoyer</button>
        
            <p id="formMessage"></p>
        
        </form>

    </main>


    <footer>
        <p>© 2026 Mon site web</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
